<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 탐사 계획 세우기</title>
<style>
:root{
  --bg:#f5f7ff; --card:#fff; --ink:#1b2140; --sub:#55607f; --line:#dde3f3;
  --pri:#4c3fd1; --pri-soft:#ece9ff; --ok:#1f8a4c; --ok-soft:#e2f6e9; --warn:#a85a00; --warn-soft:#fff1d6; --red:#c92a2a;
  --space:#0b1433;
  --fs:17px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
body.demo{--fs:22px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto;padding:8px 14px}
.hbar h1{font-size:1.05rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:.8rem;color:var(--sub);white-space:nowrap;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:.8rem;cursor:pointer;color:var(--ink);min-height:38px}
nav{max-width:900px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--sub);cursor:pointer;min-height:38px}
nav button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
nav button.done::after{content:" ✓"}
main{max-width:900px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(60,50,160,.05)}
h2{font-size:1.25rem;margin:0 0 8px}
h3{font-size:1.05rem;margin:14px 0 6px}
p{margin:6px 0}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri);margin-bottom:6px}
.hint{font-size:.86rem;color:var(--sub)}
.q{background:var(--pri-soft);border-radius:14px;padding:12px 14px;font-weight:700;margin:8px 0}
label.fl{display:block;font-weight:700;margin:14px 0 4px}
textarea,input[type=text]{width:100%;font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;min-height:50px;background:var(--pri);color:#fff}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn.big{width:100%;font-size:1.1rem;min-height:58px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grid3{grid-template-columns:1fr 1fr}}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
@media(min-width:860px){.grid3{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.hbar h1{flex:0 0 auto;font-size:0}.hbar h1::first-letter{font-size:1.2rem}.who{flex:1}}
.pick{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:16px;padding:12px;background:#fff;cursor:pointer;font:inherit;color:var(--ink)}
.pick.on{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 0 0 2px var(--pri) inset}
.pick .ttl{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.pick .ttl svg{width:52px;height:52px;flex:0 0 auto}
.pick .mark{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--pri);visibility:hidden}
.pick.on .mark{visibility:visible}
.pick ul{margin:6px 0 0;padding-left:20px;font-size:.88rem}
.pick li.plus::marker{content:"＋ ";color:var(--ok)}
.pick li.minus::marker{content:"－ ";color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink);min-height:44px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.chip.on::before{content:"✓ "}
.choices{display:grid;gap:8px;margin-top:8px}
.choice{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff;font:inherit;text-align:left;color:var(--ink);min-height:50px}
.choice .mk{width:28px;height:28px;border-radius:50%;border:2px solid var(--sub);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.choice.on{border-color:var(--pri);background:var(--pri-soft);font-weight:700}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .mk::after{content:"○"}
.choice.wrong{border-color:var(--red);background:#fff0f0}
.fb{border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--warn-soft)}
.case{border:2px solid var(--line);border-radius:16px;padding:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:var(--ink);width:100%}
.case.on{border-color:var(--pri);background:var(--pri-soft)}
.case .yr{font-size:.78rem;font-weight:700;color:var(--sub)}
.case b{display:block;font-size:1rem}
.case p{font-size:.88rem;margin:4px 0 0}
.case .mark{float:right;font-size:.78rem;font-weight:800;color:var(--pri);visibility:hidden}
.case.on .mark{visibility:visible}
.alert{border-radius:14px;padding:10px 12px;font-size:.9rem;margin-top:8px;border:2px dashed var(--warn);background:var(--warn-soft)}
.alert b{color:var(--warn)}
.okbox{border-radius:14px;padding:10px 12px;font-size:.9rem;margin-top:8px;background:var(--ok-soft)}
.window{background:var(--space);border-radius:22px;padding:6px;overflow:hidden}
.window svg{display:block;width:100%;height:auto}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.term{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:var(--ink);min-height:96px}
.term b{font-size:1.05rem;display:block}
.term .back{display:none;font-size:.9rem}
.term.flip .back{display:block}
.term.flip .front{display:none}
.self{width:100%;border-collapse:collapse;font-size:.9rem}
.self td,.self th{border:1px solid var(--line);padding:8px;text-align:center}
.self td:first-child{text-align:left}
.self button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font:inherit;font-size:.85rem;cursor:pointer;min-width:64px;min-height:40px;color:var(--ink)}
.self button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.result{white-space:pre-wrap;font-size:.85rem;background:#f8f9fd;border:1px dashed var(--line);border-radius:12px;padding:12px;max-height:320px;overflow:auto}
.notice{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20}
.bottom .in{max-width:900px;margin:0 auto;display:flex;gap:10px;padding:10px 14px}
.bottom .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2140;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(20,25,60,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:18px;padding:20px;max-width:460px;width:100%}
.colorrow{display:flex;gap:8px;flex-wrap:wrap}
.colorrow button{border:3px solid var(--line);border-radius:12px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer;background:#fff;min-height:44px;color:var(--ink)}
.colorrow button.on{border-color:var(--ink);font-weight:700}
.colorrow i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <h1>🚀 우주 탐사 계획 세우기</h1>
    <span class="who" id="who"></span>
    <button class="tbtn" id="demoBtn">시연 모드</button>
    <button class="tbtn" id="resetBtn">처음부터</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="bottom"><div class="in">
  <button class="btn ghost" id="prevBtn">◀ 이전</button>
  <button class="btn" id="nextBtn">다음 ▶</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
/* ===== 기본 자료 ===== */
const KEY="space_plan_v1";
const STEPS=[
  {id:"start",t:"시작"},{id:"open",t:"생각 열기"},{id:"method",t:"① 탐사 방법"},{id:"result",t:"② 탐사 성과"},
  {id:"target",t:"③ 대상과 목적"},{id:"plan",t:"④ 탐사 계획"},{id:"poster",t:"⑤ 미션 포스터"},{id:"quiz",t:"용어·퀴즈"},{id:"end",t:"성찰·제출"}

const METHODS={
  tel:{name:"천체 망원경",can:"지구에서 별, 행성, 은하를 관측해요.",plus:["만들고 고치기 쉬워요","비용이 적게 들어요"],minus:["대기의 흔들림과 빛 공해로 상이 흐려질 수 있어요","천체에 직접 가서 조사할 수는 없어요"]},
  stel:{name:"우주 망원경",can:"지구 대기 밖 우주 공간에서 별과 은하를 관측해요.",plus:["대기의 방해 없이 선명하게 볼 수 있어요"],minus:["만들고 쏘아 올리는 비용이 커요","고장 나면 고치기 어려워요","천체에 직접 가서 조사할 수는 없어요"]},
  crew:{name:"유인 우주 탐사선",can:"사람이 직접 타고 가서 조사해요.",plus:["사람이 현장에서 판단하고 여러 가지 일을 할 수 있어요"],minus:["공기, 물, 음식 같은 생명 유지 장치가 필요해 무겁고 비싸요","위험해서 안전이 가장 중요해요","먼 곳까지 가기 어려워요"]},
  robot:{name:"무인 우주 탐사선",can:"사람 없이 탐사선이나 로봇이 가서 조사해요.",plus:["사람이 갈 수 없는 먼 곳, 위험한 곳도 갈 수 있어요","유인 탐사보다 비용이 적어요"],minus:["지구와 신호를 주고받는 데 시간이 걸려요","예상하지 못한 상황에 대처하기 어려워요"]}
};
const CASES=[

  {id:"c02",m:"crew",yr:"1969 · 미국",t:"아폴로 11호 달 착륙",d:"사람이 처음 달에 내렸어요. 레이저 반사경으로 지구-달 거리를 정확히 재고, 가져온 월석으로 태양계의 나이를 연구했어요."},
  {id:"c03",m:"robot",yr:"1977 · 미국",t:"보이저 1·2호",d:"목성, 토성, 천왕성, 해왕성을 지나며 사진을 보냈고, 지금은 태양계 밖 공간을 날아가는 가장 먼 탐사선이에요."},
  {id:"c04",m:"stel",yr:"1990 / 2021 · 미국·유럽",t:"허블·제임스 웹 우주 망원경",d:"대기 밖에서 선명하게 관측해요. 아주 먼 은하를 관측해 우주의 나이와 팽창을 연구하고 있어요."},
  {id:"c05",m:"robot",yr:"2020 발사 · 미국",t:"퍼서비어런스와 인제뉴어티",d:"옛날 호수였던 화성 지형에서 생명체의 흔적을 찾으려고 암석 표본을 채취했고, 작은 헬리콥터가 다른 행성에서 처음 날았어요."},
  {id:"c06",m:"crew",yr:"1998 건설 시작 · 여러 나라 협력",t:"국제 우주 정거장(ISS)",d:"지구 궤도에 있는 사람이 머무는 기지예요. 무중력 환경에서 의학, 신소재 등 여러 과학 실험을 해요."},
  {id:"c07",m:"robot",yr:"2014 / 2016 발사 · 일본·미국",t:"하야부사 2호와 오시리스-렉스",d:"소행성에서 표본을 채취해 지구로 가져왔고, 물과 생명체를 이루는 물질의 단서를 찾았어요."},
  {id:"c08",m:"base",yr:"1992 · 대한민국",t:"우리별 1호",d:"우리나라 첫 인공위성. 지구 표면을 촬영하고 우주 방사선을 측정했어요."},
  {id:"c09",m:"base",yr:"2022 · 대한민국",t:"누리호",d:"우리 기술로 만든 한국형 발사체. 인공위성을 우리 힘으로 우주에 보낼 수 있게 되었어요."},
  {id:"c10",m:"robot",yr:"2022 · 대한민국",t:"다누리",d:"우리나라 첫 달 탐사선. 달 궤도를 돌며 달 표면을 촬영하고 자원 지도를 만들고 있어요."},
  {id:"c11",m:"tel",yr:"오래전부터 · 세계 여러 나라",t:"지상의 천체 망원경",d:"지구에서 천체 망원경으로 맨눈으로 보기 어려운 행성, 별, 은하를 관측해 왔어요. 우주 탐사의 첫걸음이에요."}

const TARGETS={
  orbit:{name:"지구 궤도",info:"지구에서 가장 가까운 우주예요. 국제 우주 정거장이 약 400 km 높이에서 지구를 돌고 있어요."},
  moon:{name:"달",info:"지구에서 가장 가까운 천체로 약 38만 km 떨어져 있어요. 공기가 없어요."},

  ast:{name:"소행성",info:"태양계가 처음 생길 때의 물질을 간직하고 있어 '태양계의 타임캡슐'이라고 불려요."},

const TECHS=[
  {id:"t01",ic:"♻️",n:"재사용 발사체",d:"예전에는 발사체를 한 번 쓰고 버렸어요. 우주로 올라갔던 발사체를 다시 땅에 세워 착륙시켜 여러 번 쓰면 발사 비용을 크게 줄일 수 있어요.",m:["crew","robot","stel"],t:[]},

  {id:"t03",ic:"🛡️",n:"우주 방사선 막기",d:"지구는 대기와 자기장이 해로운 우주 방사선을 막아 줘요. 우주에서는 이것이 없어서 두꺼운 벽, 특수 우주복, 땅속 기지 등으로 몸을 지켜야 해요.",m:["crew"],t:["moon","mars"]},

function warnings(){
  const w=[],m=S.method,t=S.target;

  if((m==="tel"||m==="stel")&&t!=="deep") w.push("망원경으로는 이 천체를 <b>멀리서 관측</b>할 수만 있어요. 착륙, 표본 채취, 기지 건설은 할 수 없어요.");
  if(m==="tel") w.push("지상 망원경은 <b>대기와 빛 공해</b>의 영향을 받아요. 관측 장소를 어떻게 고를지 생각해 보세요.");
  if(m==="crew"&&(t==="outer"||t==="deep")) w.push("현재 기술로는 사람이 가기에 <b>너무 멀어요</b>. 기술 개발 계획에 이 문제를 해결할 방법을 꼭 쓰세요.");
  if(m==="crew"&&t==="mars") w.push("화성에는 <b>아직 사람이 간 적이 없어요</b>. 오랜 여행 동안 필요한 공기, 물, 음식과 안전을 기술 개발 계획에 넣으세요.");
  if(m==="robot"&&t==="deep") w.push("보이저 1호도 발사 후 수십 년이 걸려서야 태양계 밖에 닿았어요. 탐사선이 <b>별까지 가기는 매우 어려워요</b>.");
  if(m==="robot"&&(t==="outer"||t==="mars")) w.push("멀리 있는 탐사선은 지구와 신호를 주고받는 데 <b>시간이 오래 걸려요</b>. 탐사선이 스스로 판단하는 기술이 필요할 수 있어요.");
  if(S.purposes.includes("사람이 머물 기지 만들기")&&m!=="crew") w.push("사람이 머물 기지를 만들려면 결국 <b>사람이 가야</b> 해요. 무인 탐사선으로 먼저 준비하는 단계라면 그렇게 써 주세요.");
  return w;
}

  if(id==="start"){bindText("#sid","sid");bindText("#nm","name");
    $("#startGo").onclick=()=>{S.sid=S.sid.trim();S.name=S.name.trim();if(!S.sid||!S.name){toast("학번과 이름을 입력해 주세요.");return}go(1)}}
  if(id==="open"){bindText("#ow","openWrite");$$("[data-life]").forEach(b=>b.onclick=()=>{toggle(S.life,b.dataset.life);save();b.classList.toggle("on")})}
  if(id==="method"){
    $$("[data-tq]").forEach(b=>b.onclick=()=>{S.telQ=+b.dataset.tq;save();render()});
    $$("[data-m]").forEach(b=>b.onclick=()=>{S.method=b.dataset.m;S.cases=S.cases.filter(c=>CASES.find(x=>x.id===c));save();render();toast(`${METHODS[S.method].name}을(를) 골랐어요.`)});
  }
  if(id==="result"){$$("[data-c]").forEach(b=>b.onclick=()=>{toggle(S.cases,b.dataset.c);save();b.classList.toggle("on");renderNav()});bindText("#learned","learned")}
  if(id==="target"){
    const upd=()=>{$("#warnBox").innerHTML=warnHTML()};upd();
    $$("[data-t]").forEach(b=>b.onclick=()=>{S.target=b.dataset.t;save();$$("[data-t]").forEach(x=>x.classList.toggle("on",x===b));upd();renderNav()});
    $$("[data-p]").forEach(b=>b.onclick=()=>{toggle(S.purposes,b.dataset.p);save();b.classList.toggle("on");upd();renderNav()});
    bindText("#ptext","purposeText");
  }
  if(id==="plan"){
    $$("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;toggle(S.acts,a);
      if(S.acts.includes(a)){S.plan=(S.plan.trim()?S.plan.trim()+"\n":"")+"• "+a+": "}else{S.plan=S.plan.split("\n").filter(l=>!l.startsWith("• "+a)).join("\n")}
      save();b.classList.toggle("on");$("#plan").value=S.plan;renderNav()});
    bindText("#plan","plan");bindText("#tech","tech");bindText("#ew","expertWhy");
    $$("[data-tech]").forEach(b=>b.onclick=()=>{const x=TECHS.find(t=>t.id===b.dataset.tech);toggle(S.techs,x.id);
      if(S.techs.includes(x.id)){S.tech=(S.tech.trim()?S.tech.trim()+"\n":"")+"• "+x.n+": ";toast(`'${x.n}'을(를) 골랐어요. 아래 칸에 어떻게 쓸지 이어 쓰세요.`)}
      else{S.tech=S.tech.split("\n").filter(l=>!l.startsWith("• "+x.n)).join("\n")}
      save();b.classList.toggle("on");$("#tech").value=S.tech;renderNav()});
    $$("[data-e]").forEach(b=>b.onclick=()=>{toggle(S.experts,b.dataset.e);save();b.classList.toggle("on");renderNav()});
  }
  if(id==="poster"){
    const upd=()=>{$("#posterBox").innerHTML=posterSVG();$("#script").textContent=scriptText()};
    bindText("#mn","mission",upd);
    $$("[data-col]").forEach(b=>b.onclick=()=>{S.color=b.dataset.col;save();$$("[data-col]").forEach(x=>x.classList.toggle("on",x===b));upd()});
  }
  if(id==="quiz"){
    $$("[data-term]").forEach(b=>b.onclick=()=>{toggle(S.terms,+b.dataset.term);save();b.classList.toggle("flip")});
    $$("[data-qi]").forEach(b=>b.onclick=()=>{S.quiz[b.dataset.qi]=+b.dataset.qj;save();render()});
    const r=$("#qReset");if(r)r.onclick=()=>{S.quiz={};save();render()};
  }
  if(id==="end"){
    $$("[data-si]").forEach(b=>b.onclick=()=>{S.self[b.dataset.si]=+b.dataset.sj;save();$$(`[data-si="${b.dataset.si}"]`).forEach(x=>x.classList.toggle("on",x===b));$("#resText").textContent=resultText()});
    bindText("#refl","refl",()=>$("#resText").textContent=resultText());
    bindText("#junk","junk",()=>$("#resText").textContent=resultText());
    $("#copyBtn").onclick=copyText;$("#pngBtn").onclick=savePNG;
  }
}
function copyText(){
  const t=resultText(),done=()=>toast("복사했어요. 패들렛 게시물에 붙여 넣으세요.");
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fb);else fb();
  function fb(){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("복사가 안 되면 글을 길게 눌러 직접 복사하세요.")}ta.remove()}
}
function wrapLines(ctx,text,maxW){const out=[];String(text).split("\n").forEach(p=>{let l="";for(const ch of p){if(ctx.measureText(l+ch).width>maxW&&l){out.push(l);l=ch}else l+=ch}out.push(l)});return out}
function savePNG(){
  const W=900,pad=36,cv=document.createElement("canvas"),ctx=cv.getContext("2d");
  ctx.font="16px Malgun Gothic";
  const lines=wrapLines(ctx,resultText().split("\n").slice(1).join("\n"),W-pad*2);
  const ph=Math.round((W-pad*2)*380/640);
  const H=110+ph+30+lines.length*24+pad;
  cv.width=W;cv.height=H;
  ctx.fillStyle="#f5f7ff";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";ctx.fillRect(16,16,W-32,H-32);ctx.strokeStyle="#dde3f3";ctx.lineWidth=2;ctx.strokeRect(16,16,W-32,H-32);
  ctx.fillStyle="#4c3fd1";ctx.font="bold 26px Malgun Gothic";ctx.fillText("🚀 우주 탐사 계획",pad,64);
  ctx.fillStyle="#1b2140";ctx.font="bold 18px Malgun Gothic";ctx.fillText(`${S.sid} ${S.name}`,pad,94);
  const img=new Image();
  img.onload=()=>{ctx.drawImage(img,pad,108,W-pad*2,ph);finish()};
  img.onerror=finish;
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(posterSVG());
  function finish(){
    let y=108+ph+40;
    lines.forEach(l=>{ctx.font=(l.startsWith("■")?"bold ":"")+"16px Malgun Gothic";ctx.fillStyle=l.startsWith("■")?"#4c3fd1":"#1b2140";ctx.fillText(l,pad,y);y+=24});
    try{const a=document.createElement("a");a.download=`우주탐사계획_${S.sid}_${S.name}.png`;a.href=cv.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();toast("이미지를 저장했어요. 패들렛에 올려 주세요.")}
    catch(e){toast("이미지 저장이 안 되면 [텍스트 복사]를 이용하세요.")}
  }
}
function modal(h){$("#modalBox").innerHTML=h;$("#modal").classList.add("show")}
function closeModal(){$("#modal").classList.remove("show")}
$("#prevBtn").onclick=()=>go(S.step-1);
$("#nextBtn").onclick=()=>go(S.step+1);
$("#demoBtn").onclick=()=>{S.demo=!S.demo;document.body.classList.toggle("demo",S.demo);save()};
$("#resetBtn").onclick=()=>{modal(`<h3 style="margin-top:0">처음부터 다시 할까요?</h3><p>입력한 내용이 모두 지워져요.</p><div class="row" style="margin-top:12px"><button class="btn ghost" id="mNo" style="flex:1">취소</button><button class="btn" id="mYes" style="flex:1;background:#c92a2a">모두 지우기</button></div>`);
  $("#mNo").onclick=closeModal;$("#mYes").onclick=()=>{S=blank();try{localStorage.removeItem(KEY)}catch(e){}closeModal();render()}};
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.body.classList.toggle("demo",!!S.demo);
render();
</script>
</body>
</html>
